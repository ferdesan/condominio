version: '3.9'

services:
  # MySQL Database
  db:
    image: mysql:8.0-alpine
    container_name: condominio-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina no .env (rode npm run secrets)}
      MYSQL_DATABASE: ${DB_NAME:-condominio_db}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina no .env (rode npm run secrets)}
    ports:
      # Bind em loopback: MySQL nao precisa (e nao deve) ser alcançavel de
      # fora do host em ambiente compartilhado/cloud.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER:-admin}", "-p${DB_PASSWORD:?defina no .env (rode npm run secrets)}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - condominio-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: condominio-redis
    # Sem porta publicada: so a rede interna alcanca o cache. Se precisar de
    # inspecao local, use `docker compose exec redis redis-cli`.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - condominio-network
    restart: unless-stopped

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: condominio-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3333
      API_URL: ${API_URL:-http://localhost:3333}

      # Database
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:?defina no .env (rode npm run secrets)}
      DB_NAME: ${DB_NAME:-condominio_db}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # JWT
      JWT_SECRET: ${JWT_SECRET:?defina no .env (rode npm run secrets)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina no .env (rode npm run secrets)}

      # AWS S3 (opcional)
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

      # Email (link de recuperacao de senha). Sem SMTP_HOST o backend cai para
      # console: desenvolvimento imprime o link, producao so registra o erro.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}

      # Base publica do front — sai no e-mail junto com o token. O default aqui
      # assume a porta padrao do container `web` (WEB_PORT).
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

    ports:
      - "127.0.0.1:${API_PORT:-3333}:3333"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - condominio-network
    restart: unless-stopped

  # Frontend Web
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: condominio-web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      - api
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - condominio-network
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  condominio-network:
    driver: bridge
